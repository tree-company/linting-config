name: CI

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"
      - name: Install dependencies
        run: "npm ci"
      - name: Lint with eslint
        run: npm run lint:js -- --no-fix
